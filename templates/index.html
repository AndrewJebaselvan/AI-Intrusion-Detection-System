<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edge AI Intrusion Detection – Research Dashboard</title>

<style>
/* --- SAME STYLES --- */
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #020617;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #e2e8f0;
}

header {
    height: 70px;
    border-bottom: 2px solid #0ea5e9;
    text-align: center;
    padding-top: 8px;
}

header h1 {
    margin: 0;
    color: #38bdf8;
    font-size: 22px;
}

.subheader {
    font-size: 13px;
    color: #94a3b8;
}

.dashboard {
    display: flex;
    height: calc(100vh - 70px);
    padding: 15px;
    gap: 15px;
    box-sizing: border-box;
}

.video-panel {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

#video {
    width: 100%;
    max-height: 100%;
    border-radius: 10px;
    border: 2px solid #22c55e;
    box-shadow: 0 0 20px rgba(34,197,94,0.25);
}

#canvas {
    position: absolute;
    top: 0;
    left: 0;
    cursor: crosshair;
}

.side-panel {
    width: 380px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
}

.card {
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 0 12px rgba(14,165,233,0.2);
}

.metric {
    display: flex;
    justify-content: space-between;
    margin: 6px 0;
}

.badge {
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: bold;
}
.low { background: #16a34a; }
.medium { background: #f59e0b; }
.high { background: #dc2626; }

button {
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: #22c55e;
    color: #020617;
    font-weight: bold;
    cursor: pointer;
}
button:hover {
    background: #16a34a;
}

#event-log {
    height: 100px;
    overflow-y: auto;
    background: #000;
    padding: 6px;
    font-size: 12px;
    border-radius: 6px;
}

#fpsChart {
    width: 100%;
    height: 120px;
    background: #000;
    border-radius: 6px;
}
</style>
</head>

<body>

<header>
    <h1>Edge AI Intrusion Detection Research Console</h1>
    <div class="subheader">
        YOLOv8 | Context-Aware Threat Scoring | Edge AI
    </div>
</header>

<div class="dashboard">

<!-- VIDEO -->
<div class="video-panel">
    <img id="video" src="{{ url_for('video_feed') }}">
    <canvas id="canvas"></canvas>
</div>

<!-- SIDE PANEL -->
<div class="side-panel">

    <!-- THREAT -->
    <div class="card">
        <h3>Threat Assessment</h3>
        <div class="metric"><span>Level</span><span id="level" class="badge low">NONE</span></div>
        <div class="metric"><span>Score</span><span id="score">0</span></div>
    </div>

    <!-- EXPLAINABILITY -->
    <div class="card">
        <h3>Explainable AI</h3>
        <div class="metric"><span>Confidence</span><span id="confidence">0</span></div>
        <div class="metric"><span>Persistence</span><span id="persistence">0</span></div>
        <div class="metric"><span>Zone</span><span id="zone">N/A</span></div>
        <div class="metric"><span>Reason</span><span id="reason">Monitoring</span></div>
    </div>

    <!-- PERFORMANCE -->
    <div class="card">
        <h3>Performance</h3>
        <div class="metric"><span>FPS</span><span id="fps">0</span></div>
        <canvas id="fpsChart"></canvas>
    </div>

    <!-- 📁 UPLOAD -->
    <div class="card">
        <h3>Upload Video</h3>

        <input type="file" id="videoInput" hidden>

        <button onclick="document.getElementById('videoInput').click()">
            Select Video
        </button>

        <p id="upload-status">No file selected</p>
    </div>

    <!-- 🤖 AI QUERY SYSTEM -->
    <div class="card">
        <h3>AI Query System</h3>

        <input type="text" id="queryInput"
               placeholder="Ask about events..."
               style="width:100%; padding:6px; margin-bottom:6px;">

        <button onclick="askAI()">Ask</button>

        <p id="aiResponse" style="margin-top:8px; font-size:13px;"></p>
    </div>

    <!-- EVENTS -->
    <div class="card">
        <h3>Event Log</h3>
        <div id="event-log"></div>
    </div>

</div>
</div>

<script>

/* ---------- UPLOAD ---------- */
document.getElementById("videoInput").addEventListener("change", async () => {
    let file = document.getElementById("videoInput").files[0];

    let formData = new FormData();
    formData.append("file", file);

    document.getElementById("upload-status").innerText = "Uploading...";

    await fetch("/upload", {
        method: "POST",
        body: formData
    });

    document.getElementById("upload-status").innerText = "Processing complete";
});


/* ---------- AI QUERY ---------- */
async function askAI(){
    let query = document.getElementById("queryInput").value;

    let res = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({query: query})
    });

    let data = await res.json();

    document.getElementById("aiResponse").innerText = data.answer;
}


/* ---------- ALERT STATUS ---------- */
function updateStatus(){
    fetch("/alert_status")
    .then(res=>res.json())
    .then(data=>{
        document.getElementById("score").innerText=data.score;
        document.getElementById("confidence").innerText=data.confidence;
        document.getElementById("persistence").innerText=data.persistence;
        document.getElementById("zone").innerText=data.zone;
        document.getElementById("reason").innerText=data.reason;
        document.getElementById("fps").innerText=data.fps;
        document.getElementById("level").innerText=data.level;

        let levelElem=document.getElementById("level");
        levelElem.className="badge";

        if(data.level==="HIGH") levelElem.classList.add("high");
        else if(data.level==="MEDIUM") levelElem.classList.add("medium");
        else levelElem.classList.add("low");

        if(data.level==="HIGH"){
            let log=document.getElementById("event-log");
            let time=new Date().toLocaleTimeString();
            log.innerHTML = `[${time}] HIGH THREAT<br>` + log.innerHTML;
        }
    });
}

setInterval(updateStatus,1000);

</script>

</body>
</html>
